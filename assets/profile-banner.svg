<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mainul Hasan Khan — Art × Engineering</title>
  <desc id="desc">A dark abstract banner blending geometric grids, flowing motion paths, violet, and cyan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <circle cx="105" cy="62" r="210" fill="url(#glowViolet)" filter="url(#blur)"/>
  <circle cx="1100" cy="280" r="235" fill="url(#glowCyan)" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-20 255C175 130 304 345 520 195S852 65 1225 130" stroke="url(#accent)" stroke-width="3" opacity=".9"/>
    <path d="M-20 278C190 158 315 365 540 220S875 88 1225 153" stroke="url(#accent)" stroke-width="1.2" opacity=".34"/>
    <path d="M865 26l34 20 34-20 34 20 34-20 34 20" stroke="#22d3ee" stroke-width="2" opacity=".4"/>
  </g>

  <g transform="translate(76 73)">
    <rect width="9" height="82" rx="4.5" fill="url(#accent)"/>
    <text x="34" y="35" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-1">
      Mainul Hasan Khan
    </text>
    <text x="36" y="71" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="4">
      ART × ENGINEERING
    </text>
  </g>

  <g transform="translate(824 231)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
    <text fill="#a78bfa">research</text>
    <text x="76" fill="#64748b">/</text>
    <text x="94" fill="#e879f9">software</text>
    <text x="164" fill="#64748b">/</text>
    <text x="182" fill="#67e8f9">motion</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>

